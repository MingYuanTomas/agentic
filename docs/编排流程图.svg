<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph 智能体编排流程图</title>
  <desc id="desc">用户任务经规划拆分为并行子任务，执行后汇总，经审核通过或修订，最终输出报告。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-rev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10px; }
    .node-title { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .node-sub { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
    .chip { fill: #ffffff; stroke: #99f6e4; stroke-width: 1.2; rx: 8px; }
    .chip-title { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f766e; }
    .chip-sub { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    .edge { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .edge-label { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    .edge-rev { stroke: #f43f5e; stroke-width: 2; stroke-dasharray: 7 5; fill: none; }
    .edge-ok { stroke: #10b981; stroke-width: 2; fill: none; }
    .watermark { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; }
  </style>

  <rect width="1160" height="620" fill="#f6f7fb"/>

  <!-- 节点 -->
  <g>
    <rect class="node" x="20" y="260" width="150" height="82" fill="#eef2ff" stroke="#a5b4fc"/>
    <text class="node-title" x="95" y="295" text-anchor="middle" fill="#4338ca">用户任务</text>
    <text class="node-sub" x="95" y="322" text-anchor="middle">目标字符串</text>
  </g>
  <g>
    <rect class="node" x="235" y="260" width="150" height="82" fill="#eef2ff" stroke="#a5b4fc"/>
    <text class="node-title" x="310" y="295" text-anchor="middle" fill="#4338ca">规划</text>
    <text class="node-sub" x="310" y="322" text-anchor="middle">拆成 1–5 个子任务</text>
  </g>
  <g>
    <rect class="node" x="450" y="190" width="230" height="222" fill="#f0fdfa" stroke="#5eead4"/>
    <text class="node-title" x="565" y="218" text-anchor="middle" fill="#0f766e">并行执行</text>
    <text class="node-sub" x="565" y="239" text-anchor="middle">同一节点，并发运行</text>
    <g>
      <rect class="chip" x="475" y="255" width="180" height="44"/>
      <text class="chip-title" x="565" y="280" text-anchor="middle">子任务 1 · 需求分析</text>
    </g>
    <g>
      <rect class="chip" x="475" y="311" width="180" height="44"/>
      <text class="chip-title" x="565" y="336" text-anchor="middle">子任务 2 · 实施方案</text>
    </g>
    <g>
      <rect class="chip" x="475" y="367" width="180" height="44"/>
      <text class="chip-title" x="565" y="392" text-anchor="middle">子任务 3 · 验证方案</text>
    </g>
  </g>
  <g>
    <rect class="node" x="765" y="260" width="150" height="82" fill="#fff7ed" stroke="#fdba74"/>
    <text class="node-title" x="840" y="295" text-anchor="middle" fill="#c2410c">汇总</text>
    <text class="node-sub" x="840" y="322" text-anchor="middle">合并为 Markdown</text>
  </g>
  <g>
    <rect class="node" x="985" y="260" width="150" height="82" fill="#fff1f2" stroke="#fda4af"/>
    <text class="node-title" x="1060" y="295" text-anchor="middle" fill="#be123c">审核</text>
    <text class="node-sub" x="1060" y="322" text-anchor="middle">通过 / 修改意见</text>
  </g>
  <g>
    <rect class="node" x="985" y="465" width="150" height="82" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text class="node-title" x="1060" y="500" text-anchor="middle" fill="#047857">交付</text>
    <text class="node-sub" x="1060" y="527" text-anchor="middle">输出报告与状态</text>
  </g>

  <!-- 主链路 -->
  <g>
    <path class="edge" d="M 170 301 L 229 301" marker-end="url(#arrow)"/>
    <path class="edge" d="M 385 301 L 443 301" marker-end="url(#arrow)"/>
    <text class="edge-label" x="414" y="286" text-anchor="middle">Send 并发分发</text>
    <path class="edge" d="M 680 301 L 759 301" marker-end="url(#arrow)"/>
    <text class="edge-label" x="719" y="286" text-anchor="middle">按索引排序合并</text>
    <path class="edge" d="M 915 301 L 979 301" marker-end="url(#arrow)"/>
  </g>

  <!-- 审核分支 -->
  <g>
    <path class="edge-ok" d="M 1060 342 L 1060 459" marker-end="url(#arrow-ok)"/>
    <text class="edge-label" x="1070" y="405" fill="#047857">通过或达到上限</text>
    <path class="edge-rev" d="M 1060 342 C 1060 435 840 435 840 348" marker-end="url(#arrow-rev)"/>
    <text class="edge-label" x="950" y="431" fill="#be123c">未通过，返回修订</text>
  </g>

  <text class="watermark" x="20" y="598">LangGraph StateGraph · 规划 → Send 并行执行 → 汇总 → 有界审核修订</text>
</svg>

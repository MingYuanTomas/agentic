[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-langgraph"
version = "0.1.0"
description = "A LangGraph orchestrator with parallel workers and bounded review loops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
agentic = "agentic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
